<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Purple Gradient -->
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BA68C8" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7B1FA2" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glass Body Gradient -->
    <linearGradient id="glassBodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glass Outline Gradient -->
    <linearGradient id="glassOutlineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E0E0E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B0BEC5" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Glowing Cloud (Behind Moon) -->
  <path d="M 45,68 C 45,61 50,56 56,56 C 58,56 60,57 62,58 C 65,52 71,48 78,48 C 85,48 90,53 91,60 C 93,60 95,62 95,65 C 95,69 91.5,72 87,72 L 53,72 C 48.5,72 45,68.5 45,68 Z" fill="url(#purpleGrad)"/>

  <!-- Glass Crescent Moon -->
  <path d="M 55,20 C 35,20 20,35 20,55 C 20,75 35,90 55,90 C 43,80 38,65 38,55 C 38,45 43,30 55,20 Z" fill="url(#glassBodyGrad)" stroke="url(#glassOutlineGrad)" stroke-width="2.5" />

  <!-- Stars (Purple & White Glow) -->
  <path d="M 65,20 L 66.5,23.5 L 70,25 L 66.5,26.5 L 65,30 L 63.5,26.5 L 60,25 L 63.5,23.5 Z" fill="#E1BEE7" opacity="0.95"/>
  <path d="M 32,32 L 33,34.5 L 35.5,35 L 33,35.5 L 32,38 L 31,35.5 L 28.5,35 L 31,34.5 Z" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="28" cy="22" r="1.5" fill="#BA68C8" opacity="0.6"/>

  <!-- Highlights / Reflections on Glass Moon -->
  <path d="M 48,22 C 34,26 23.5,39 23.5,55 C 23.5,69 31,79 43,85" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <circle cx="28" cy="36" r="1.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
