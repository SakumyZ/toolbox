<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Silver/Gray Gradient -->
    <linearGradient id="silverGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CFD8DC" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#546E7A" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glass Body Gradient -->
    <linearGradient id="glassBodyGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.0"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.25"/>
    </linearGradient>

    <!-- Glass Outline Gradient -->
    <linearGradient id="glassOutlineGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E0E0E0" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#B0BEC5" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Top Crown Loop (Glass) -->
  <ellipse cx="50" cy="18" rx="8" ry="5" fill="none" stroke="url(#glassOutlineGrad)" stroke-width="2.5" opacity="0.8"/>

  <!-- Bell Clapper (Bottom Ball) -->
  <path d="M 44,74 C 44,81 56,81 56,74 Z" fill="url(#silverGrad)"/>

  <!-- Glass Bell Body -->
  <path d="M 50,22 C 40,22 36,29 36,38 L 34,55 C 34,62 30,68 24,71 C 22,72 22,74 25,74 L 75,74 C 78,74 78,72 76,71 C 70,68 66,62 66,55 L 64,38 C 64,29 60,22 50,22 Z" fill="url(#glassBodyGrad)" stroke="url(#glassOutlineGrad)" stroke-width="2.5" />

  <!-- Inner Silver Glow Line -->
  <path d="M 50,26 C 44,26 40,32 40,40 L 38,55" fill="none" stroke="#CFD8DC" stroke-width="2" stroke-linecap="round" opacity="0.4"/>

  <!-- Specular Highlights / Reflections -->
  <!-- Left curve reflection -->
  <path d="M 39,34 C 38,40 37,50 35,58" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  <circle cx="42" cy="30" r="1.5" fill="#FFFFFF" opacity="0.8"/>
  <!-- Right edge reflection -->
  <path d="M 61,34 C 62,40 63,50 65,58" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" opacity="0.35"/>
</svg>
